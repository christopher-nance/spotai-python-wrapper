[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotai-python-wrapper"
version = "0.1.0"
description = "Unofficial Python wrapper for the Spot AI REST API, with a damage-claim footage collector"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["spot-ai", "video", "surveillance", "lpr", "anpr", "carwash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "responses>=0.25.0"]

[tool.setuptools.packages.find]
include = ["spotai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
